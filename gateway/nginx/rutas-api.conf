# =====================================================================
# Library API Gateway — rutas y políticas COMUNES.
# Lo incluyen los dos servidores de nginx:
#   - :8080  (library-gateway.conf)  solo API, como pide RF1
#   - :80    (library-web.conf)      monolito en "/" + API en "/api/…", como la demo de clase
# Así la tabla de rutas vive en un solo lugar. Se instala en
# /etc/nginx/library-gateway/rutas-api.conf (fuera de conf.d: no es un archivo del
# contexto http, son directivas de "server").
# =====================================================================

# El X-Request-ID vuelve al cliente en TODAS las respuestas, incluidas las de error.
add_header X-Request-ID $gw_rid always;
# Qué instancia atendió (p. ej. 127.0.0.1:6001): evidencia del balanceo para la
# práctica. En producción se quitaría para no exponer direcciones internas.
add_header X-Gateway-Instancia $upstream_addr always;

# ---- Cabeceras hacia los servicios (RF2) --------------------------
# nginx reenvía SIN tocar método, query, cuerpo, Cookie y Authorization;
# solo agrega las cabeceras estándar de proxy y el X-Request-ID.
proxy_http_version 1.1;
proxy_set_header Host              $http_host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID      $gw_rid;
proxy_set_header Connection        "";

# ---- Timeouts y reintentos (RF4, RF6) ------------------------------
proxy_connect_timeout 3s;     # instancia que no acepta la conexión -> se prueba la otra
proxy_send_timeout    10s;
proxy_read_timeout    10s;    # servicio que no contesta en 10 s -> 504
# Si una instancia rechaza la conexión o se agota el tiempo, se reintenta con la
# siguiente (máximo 2 intentos). nginx NO repite un POST/PATCH que ya se envió.
proxy_next_upstream error timeout;
proxy_next_upstream_tries 2;

# ---- Errores uniformes en JSON con request_id (RF6) ----------------
# Solo para errores que genera el GATEWAY (ruta inexistente, servicio caído,
# timeout, límite). Los errores de los servicios (401, 404 de un libro…) y las
# páginas de error del monolito pasan intactos.
error_page 404     = @gw_404;
error_page 502 503 = @gw_503;
error_page 504     = @gw_504;
error_page 429     = @gw_429;

location @gw_429 {
    default_type application/json; charset utf-8; charset_types application/json;
    add_header Retry-After 1 always;
    add_header X-Request-ID $gw_rid always;
    return 429 '{"estado":"error","codigo_error":"ERR_DEMASIADAS_SOLICITUDES","mensaje":"Demasiadas solicitudes desde tu IP. Intenta de nuevo en unos segundos.","servicio":"$gw_servicio","request_id":"$gw_rid"}';
}
location @gw_404 {
    default_type application/json; charset utf-8; charset_types application/json;
    return 404 '{"estado":"error","codigo_error":"ERR_GATEWAY_RUTA","mensaje":"Ruta no encontrada en el gateway. Usa /api/<servicio>/<ruta>.","servicio":"$gw_servicio","request_id":"$gw_rid"}';
}
location @gw_503 {
    default_type application/json; charset utf-8; charset_types application/json;
    return 503 '{"estado":"error","codigo_error":"ERR_SERVICIO_NO_DISPONIBLE","mensaje":"El servicio $gw_servicio no está disponible en este momento.","servicio":"$gw_servicio","request_id":"$gw_rid"}';
}
location @gw_504 {
    default_type application/json; charset utf-8; charset_types application/json;
    return 504 '{"estado":"error","codigo_error":"ERR_TIEMPO_AGOTADO","mensaje":"El servicio $gw_servicio no respondió a tiempo.","servicio":"$gw_servicio","request_id":"$gw_rid"}';
}

# ---- Salud agregada (RF5) ------------------------------------------
location = /health {
    proxy_pass http://127.0.0.1:8090/health;
}

# ---- Tabla de rutas (RF1) ------------------------------------------
# proxy_redirect: si un servicio responde "Location: /api/books/978…" (ruta
# relativa a ÉL), se le antepone el prefijo del gateway. Solo cambia la cabecera.

# Inicio de sesión: además del límite general, el límite estricto de login.
# (Una location con limit_req propio no hereda el del server: se repiten ambos.)
location = /api/login/login {
    limit_req zone=lim_ip burst=40 nodelay;
    limit_req zone=lim_login burst=20 nodelay;
    proxy_pass     http://gw_login/login;
    proxy_redirect / /api/login/;
    proxy_set_header X-Forwarded-Prefix /api/login;
}
location /api/login/ {
    proxy_pass     http://gw_login/;
    proxy_redirect / /api/login/;
    proxy_set_header X-Forwarded-Prefix /api/login;
}
location /api/books/ {
    proxy_pass     http://gw_books/;
    proxy_redirect / /api/books/;
    proxy_set_header X-Forwarded-Prefix /api/books;
}
location /api/pagos/ {
    proxy_pass     http://gw_pagos/;
    proxy_redirect / /api/pagos/;
    proxy_set_header X-Forwarded-Prefix /api/pagos;
}
location /api/pedidos/ {
    proxy_pass     http://gw_pedidos/;
    proxy_redirect / /api/pedidos/;
    proxy_set_header X-Forwarded-Prefix /api/pedidos;
}
location /api/users/ {
    proxy_pass     http://gw_users/;
    proxy_redirect / /api/users/;
    proxy_set_header X-Forwarded-Prefix /api/users;
}
location /api/autores/ {
    proxy_pass     http://gw_autores/;
    proxy_redirect / /api/autores/;
    proxy_set_header X-Forwarded-Prefix /api/autores;
}
# SOAP/REST bilingüe: lo consume la app Electron (catálogo en XML).
location /api/soap/ {
    proxy_pass     http://gw_soap/;
    proxy_redirect / /api/soap/;
    proxy_set_header X-Forwarded-Prefix /api/soap;
}

# /api/<algo que no existe> -> 404 JSON del gateway.
location /api/ {
    return 404;
}
