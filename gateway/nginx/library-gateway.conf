# =====================================================================
# Library API Gateway (nginx) — punto único de entrada en el puerto 8080
#
#   cliente  ->  http://<IP>:8080/api/<servicio>/<ruta del servicio>
#   gateway  ->  http://127.0.0.1:<puerto>/<ruta del servicio>
#
# Estilo A de la clase: el prefijo /api/<servicio> se ELIMINA antes de
# reenviar (la "/" final de proxy_pass lo hace), así el servicio recibe
# exactamente la ruta que ya conoce y las apps solo cambian su URL base.
#
#   /api/login/login              -> 127.0.0.1:5000/login
#   /api/books/api/books?x=1      -> 127.0.0.1:5001 o :6001 /api/books?x=1
#
# Se instala como /etc/nginx/conf.d/library-gateway.conf (ver ../desplegar.sh).
# Estos bloques (map, upstream) viven en el contexto http de nginx.conf.
# =====================================================================

# ---- Identificador de petición (RF6/RF7) ------------------------------
# Si el cliente manda un X-Request-ID razonable se respeta (para seguir una
# petición de punta a punta); si no, se usa el que genera nginx ($request_id).
map $http_x_request_id $gw_rid {
    "~^[A-Za-z0-9._-]{1,64}$" $http_x_request_id;
    default                   $request_id;
}

# Servicio de la ruta (/api/books/... -> books), para errores y registros.
map $uri $gw_servicio {
    "~^/api/(?<svc>[a-z]+)/" $svc;
    default                  "-";
}

# ---- Límite de tasa por IP (RF8) --------------------------------------
# General: 20 peticiones/s por IP, con ráfagas de hasta 40 sin espera.
# Login: más estricto (30 por minuto, ráfaga de 20): verificar la contraseña
# con bcrypt es lo más costoso del sistema (fue lo primero en degradarse en
# las pruebas de Locust) y es el blanco de ataques de fuerza bruta.
# Al excederlo, el gateway responde 429 JSON y el servicio nunca ve la petición.
limit_req_zone $binary_remote_addr zone=lim_ip:10m    rate=20r/s;
limit_req_zone $binary_remote_addr zone=lim_login:10m rate=30r/m;
limit_req_status 429;

# ---- Registro: una línea por petición (RF7) ---------------------------
# request_id · método · ruta (sin query, para no registrar datos de más) ·
# servicio · instancia que atendió · código · duración total y del servicio (s, en ms de precisión).
log_format gw_registro '$time_iso8601 $gw_rid $request_method $uri -> $gw_servicio '
                       'instancia=$upstream_addr status=$status total=${request_time}s '
                       'servicio=${upstream_response_time}s ip=$remote_addr';

# ---- Instancias de cada servicio (RF3, RF4) ---------------------------
# Round robin (el algoritmo por defecto de upstream). Una instancia que falla
# 2 veces se saca de rotación 10 s (max_fails / fail_timeout). Con una sola
# instancia nginx nunca la saca: si cae, el cliente recibe 503 JSON.
# zone: memoria compartida entre los procesos worker de nginx, para que TODOS lleven
# el mismo turno del round robin y el mismo conteo de fallas.
upstream gw_login   { zone gw_login 64k; server 127.0.0.1:5000 max_fails=2 fail_timeout=10s; }
upstream gw_books   {
    zone gw_books 64k;
    server 127.0.0.1:5001 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:6001 max_fails=2 fail_timeout=10s;
}
upstream gw_pagos   { zone gw_pagos 64k; server 127.0.0.1:5002 max_fails=2 fail_timeout=10s; }
upstream gw_pedidos { zone gw_pedidos 64k; server 127.0.0.1:5003 max_fails=2 fail_timeout=10s; }
upstream gw_users   { zone gw_users 64k; server 127.0.0.1:5004 max_fails=2 fail_timeout=10s; }
upstream gw_autores { zone gw_autores 64k; server 127.0.0.1:5005 max_fails=2 fail_timeout=10s; }
upstream gw_soap    { zone gw_soap 64k; server 127.0.0.1:5006 max_fails=2 fail_timeout=10s; }

# ---- Servidor del gateway: solo API, puerto 8080 (RF1) -----------------
server {
    listen 8080;
    server_name _;

    client_max_body_size 5M;
    access_log /var/log/nginx/gateway.log gw_registro;
    limit_req zone=lim_ip burst=40 nodelay;

    # Rutas, cabeceras, timeouts, errores JSON y /health: comunes con el puerto 80.
    include /etc/nginx/library-gateway/rutas-api.conf;

    # En el 8080 solo hay API: cualquier otra ruta es 404 JSON.
    location / {
        return 404;
    }
}