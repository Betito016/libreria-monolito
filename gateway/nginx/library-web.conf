# =====================================================================
# Puerto 80 (sin número de puerto en la URL), igual que la demo de clase:
#
#   http://<IP>/                  -> monolito web (Express, 127.0.0.1:3000)
#   http://<IP>/api/<servicio>/…  -> microservicios, MISMAS rutas y políticas que :8080
#   http://<IP>/health            -> salud agregada del gateway
#
# Reemplaza al antiguo libreria.conf, que publicaba el monolito en /library/
# reescribiendo su HTML con sub_filter. Ahora el monolito vive en la raíz, sin
# reescrituras, y /library/… redirige a la ruta nueva para no romper enlaces viejos.
# Se instala como /etc/nginx/conf.d/library-web.conf (ver ../desplegar.sh).
# =====================================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 10M;      # el monolito permite subir imágenes de libros
    access_log /var/log/nginx/gateway.log gw_registro;
    limit_req zone=lim_ip burst=40 nodelay;

    # /api/…, /health, errores JSON, cabeceras y timeouts: lo mismo que el puerto 8080.
    include /etc/nginx/library-gateway/rutas-api.conf;

    # Enlaces antiguos: /library/libros -> /libros
    location = /library { return 301 /; }
    location /library/ {
        rewrite ^/library/(.*)$ /$1 permanent;
    }

    # Todo lo demás es el monolito web.
    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
