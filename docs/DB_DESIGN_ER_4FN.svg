<svg viewBox="0 0 1220 920" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1220" height="920" fill="#ffffff"/>

  <text x="610" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">
    Diagrama ER — Librería en Línea (esquema en 4FN)
  </text>
  <text x="610" y="49" text-anchor="middle" font-size="12" fill="#475569">
    Tablas puente en rosa oscuro = dependencia multivaluada resuelta; libro_concepto además lleva un atributo propio (definicion),
  </text>
  <text x="610" y="64" text-anchor="middle" font-size="12" fill="#475569">
    prueba de que la definición depende del PAR (libro, concepto) y no puede vivir en "conceptos" (razón de la 4FN).
  </text>

  <!-- ================= usuarios (standalone) ================= -->
  <g>
    <rect x="960" y="90" width="230" height="150" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
    <rect x="960" y="90" width="230" height="30" rx="8" fill="#334155"/>
    <text x="1075" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">usuarios</text>
    <text x="975" y="140" font-size="11" fill="#0f172a">PK id (UUID)</text>
    <text x="975" y="156" font-size="11" fill="#0f172a">nombre, email (UNIQUE)</text>
    <text x="975" y="172" font-size="11" fill="#0f172a">password_hash (bcrypt)</text>
    <text x="975" y="188" font-size="11" fill="#0f172a">rol ENUM(administrador,cliente)</text>
    <text x="975" y="204" font-size="11" fill="#0f172a">activo, fecha_registro</text>
    <text x="975" y="222" font-size="10" fill="#b91c1c" font-weight="600">Índice único parcial: máx. 1 rol='administrador'</text>
  </g>

  <!-- ================= formatos ================= -->
  <g>
    <rect x="500" y="90" width="220" height="110" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
    <rect x="500" y="90" width="220" height="28" rx="8" fill="#c2410c"/>
    <text x="610" y="109" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">formatos</text>
    <text x="515" y="138" font-size="11" fill="#0f172a">PK id (SERIAL)</text>
    <text x="515" y="154" font-size="11" fill="#0f172a">nombre (UNIQUE)</text>
    <text x="515" y="172" font-size="10" fill="#7c2d12">catálogo independiente</text>
  </g>

  <!-- ================= libros (center) ================= -->
  <g>
    <rect x="490" y="330" width="240" height="180" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
    <rect x="490" y="330" width="240" height="30" rx="8" fill="#1d4ed8"/>
    <text x="610" y="351" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">libros</text>
    <text x="505" y="378" font-size="11" fill="#0f172a">PK id (SERIAL)</text>
    <text x="505" y="394" font-size="11" fill="#0f172a">isbn (UNIQUE)</text>
    <text x="505" y="410" font-size="11" fill="#0f172a">titulo, anio_publicacion</text>
    <text x="505" y="426" font-size="11" fill="#0f172a">precio CHECK(&gt;=0)</text>
    <text x="505" y="442" font-size="11" fill="#0f172a">stock CHECK(&gt;=0)</text>
    <text x="505" y="458" font-size="11" fill="#0f172a">FK formato_id → formatos.id</text>
    <text x="505" y="474" font-size="11" fill="#0f172a">creado_en, actualizado_en</text>
    <text x="505" y="495" font-size="10" fill="#1e3a8a" font-weight="600">isbn → titulo, anio, precio, stock, formato_id (FD)</text>
  </g>

  <!-- libros - formatos link -->
  <line x1="610" y1="200" x2="610" y2="330" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="595" y="220" text-anchor="end" font-size="11" fill="#334155">1</text>
  <text x="595" y="320" text-anchor="end" font-size="11" fill="#334155">N</text>

  <!-- ================= autores + libro_autor (left) ================= -->
  <g>
    <rect x="40" y="330" width="200" height="100" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
    <rect x="40" y="330" width="200" height="28" rx="8" fill="#4338ca"/>
    <text x="140" y="349" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">autores</text>
    <text x="55" y="378" font-size="11" fill="#0f172a">PK id (SERIAL)</text>
    <text x="55" y="394" font-size="11" fill="#0f172a">nombre (UNIQUE)</text>
    <text x="55" y="412" font-size="10" fill="#312e81">un autor : varios libros</text>
  </g>
  <g>
    <rect x="280" y="345" width="180" height="70" rx="8" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
    <rect x="280" y="345" width="180" height="24" rx="8" fill="#be185d"/>
    <text x="370" y="361" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">libro_autor</text>
    <text x="292" y="386" font-size="10.5" fill="#0f172a">PK,FK libro_id → libros.id</text>
    <text x="292" y="401" font-size="10.5" fill="#0f172a">PK,FK autor_id → autores.id</text>
  </g>
  <line x1="240" y1="380" x2="280" y2="380" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="248" y="374" font-size="10" fill="#334155">1</text>
  <text x="270" y="374" font-size="10" fill="#334155">N</text>
  <line x1="460" y1="380" x2="490" y2="410" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="465" y="374" font-size="10" fill="#334155">N</text>
  <text x="480" y="410" font-size="10" fill="#334155">1</text>

  <!-- ================= generos + libro_genero (right) ================= -->
  <g>
    <rect x="980" y="330" width="200" height="100" rx="8" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5"/>
    <rect x="980" y="330" width="200" height="28" rx="8" fill="#15803d"/>
    <text x="1080" y="349" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">generos</text>
    <text x="995" y="378" font-size="11" fill="#0f172a">PK id (SERIAL)</text>
    <text x="995" y="394" font-size="11" fill="#0f172a">nombre (UNIQUE)</text>
    <text x="995" y="412" font-size="10" fill="#14532d">un género : varios libros</text>
  </g>
  <g>
    <rect x="760" y="345" width="180" height="70" rx="8" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
    <rect x="760" y="345" width="180" height="24" rx="8" fill="#be185d"/>
    <text x="850" y="361" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">libro_genero</text>
    <text x="772" y="386" font-size="10.5" fill="#0f172a">PK,FK libro_id → libros.id</text>
    <text x="772" y="401" font-size="10.5" fill="#0f172a">PK,FK genero_id → generos.id</text>
  </g>
  <line x1="980" y1="380" x2="940" y2="380" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="967" y="374" font-size="10" fill="#334155">1</text>
  <text x="945" y="374" font-size="10" fill="#334155">N</text>
  <line x1="760" y1="380" x2="730" y2="410" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="755" y="374" font-size="10" fill="#334155">N</text>
  <text x="735" y="410" font-size="10" fill="#334155">1</text>

  <!-- ================= conceptos + libro_concepto (bottom) ================= -->
  <g>
    <rect x="40" y="620" width="200" height="100" rx="8" fill="#fefce8" stroke="#a16207" stroke-width="1.5"/>
    <rect x="40" y="620" width="200" height="28" rx="8" fill="#a16207"/>
    <text x="140" y="639" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">conceptos</text>
    <text x="55" y="668" font-size="11" fill="#0f172a">PK id (SERIAL)</text>
    <text x="55" y="684" font-size="11" fill="#0f172a">termino (UNIQUE)</text>
    <text x="55" y="702" font-size="10" fill="#713f12">catálogo de términos</text>
  </g>
  <g>
    <rect x="290" y="605" width="260" height="130" rx="8" fill="#fdf2f8" stroke="#9d174d" stroke-width="2.5"/>
    <rect x="290" y="605" width="260" height="28" rx="8" fill="#9d174d"/>
    <text x="420" y="624" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">libro_concepto</text>
    <text x="302" y="654" font-size="11" fill="#0f172a">PK,FK libro_id → libros.id</text>
    <text x="302" y="672" font-size="11" fill="#0f172a">PK,FK concepto_id → conceptos.id</text>
    <text x="302" y="694" font-size="11.5" font-weight="700" fill="#831843">definicion (TEXT) ← atributo propio</text>
    <text x="302" y="712" font-size="10" fill="#831843">depende del PAR (libro, concepto), no solo del concepto</text>
    <text x="302" y="726" font-size="10" fill="#831843">→ evidencia central de la 4FN de este modelo</text>
  </g>
  <line x1="140" y1="620" x2="140" y2="510" stroke="#334155" stroke-width="1.5"/>
  <line x1="140" y1="510" x2="290" y2="640" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="150" y="560" font-size="10" fill="#334155">1</text>
  <text x="265" y="635" font-size="10" fill="#334155">N</text>
  <line x1="610" y1="510" x2="550" y2="640" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="595" y="560" font-size="10" fill="#334155">1</text>
  <text x="560" y="635" font-size="10" fill="#334155">N</text>

  <!-- ================= imagenes (bottom right) ================= -->
  <g>
    <rect x="900" y="620" width="260" height="130" rx="8" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
    <rect x="900" y="620" width="260" height="28" rx="8" fill="#0e7490"/>
    <text x="1030" y="639" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">imagenes</text>
    <text x="912" y="668" font-size="11" fill="#0f172a">PK id (SERIAL)</text>
    <text x="912" y="684" font-size="11" fill="#0f172a">FK libro_id → libros.id</text>
    <text x="912" y="700" font-size="11" fill="#0f172a">url_imagen, texto_alt</text>
    <text x="912" y="716" font-size="11" fill="#0f172a">es_principal, orden</text>
    <text x="912" y="732" font-size="10" fill="#164e63">Índice único parcial: máx. 1 es_principal=TRUE por libro</text>
  </g>
  <line x1="700" y1="510" x2="1000" y2="620" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="710" y="530" font-size="10" fill="#334155">1</text>
  <text x="985" y="612" font-size="10" fill="#334155">N</text>

  <!-- Legend -->
  <rect x="60" y="800" width="1100" height="95" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="80" y="822" font-size="12" font-weight="700" fill="#0f172a">Dependencias multivaluadas resueltas con tabla puente (4FN):</text>
  <text x="80" y="841" font-size="11" fill="#334155">isbn ↠ autor (libro_autor) · isbn ↠ genero (libro_genero) · isbn ↠ imagen (imagenes, 1:N directa) ·</text>
  <text x="80" y="858" font-size="11" fill="#334155">isbn ↠ (concepto, definicion) (libro_concepto — la definición es un atributo del PAR, no del concepto por sí solo).</text>
  <text x="80" y="879" font-size="11" fill="#334155">Ninguna de estas se modeló como lista/columna repetida dentro de "libros": cada una tiene su propia tabla y clave primaria compuesta.</text>

  <text x="610" y="913" text-anchor="middle" font-size="10" fill="#94a3b8">
    docs/DB_DESIGN_ER_4FN.svg — Ejercicio 02, Integración de Aplicaciones Computacionales, UDEM
  </text>
</svg>
