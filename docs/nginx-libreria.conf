## /etc/nginx/conf.d/libreria.conf
## Reverse proxy para la app monolitica Node.js/Express bajo el prefijo
## /library. La app internamente genera todos sus enlaces/redirecciones
## como rutas absolutas desde raiz (href="/...", action="/...",
## res.redirect('/...')) sin conocer el prefijo /library; en vez de
## modificar cada controlador y vista, se reescribe la respuesta al
## vuelo con sub_filter (cuerpo HTML) y proxy_redirect (cabecera
## Location de las redirecciones POST/Redirect/GET).

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 10M;   # permite subir imagenes

    # Conveniencia: raiz redirige al prefijo del ejercicio
    location = / {
        return 302 /library/;
    }

    # Normaliza /library (sin barra final) -> /library/
    location = /library {
        return 301 /library/;
    }

    location /library/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cabecera Location de las redirecciones (patron Post/Redirect/Get)
        proxy_redirect / /library/;

        # Enlaces, formularios y estaticos generados como rutas absolutas
        sub_filter 'href="/'   'href="/library/';
        sub_filter 'action="/' 'action="/library/';
        sub_filter 'src="/'    'src="/library/';
        sub_filter_once off;
        sub_filter_types text/html;
    }
}
